services:
  api:
    build: .
    expose:
      - "8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy # Wait for the DB healthcheck to pass
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://api_user:api_password@db:5432/api_db}
      - SECRET_KEY
      - COMMON_PASSWORD
      - CORS_ORIGINS
      - ENVIRONMENT

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
      POSTGRES_DB: api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Add a healthcheck so Docker knows when Postgres is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  certbot_conf:
  certbot_www: